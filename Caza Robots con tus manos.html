<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caza Robots con tus manos</title>
<style>
:root{--bg:#0b1020;--fg:#fff;--accent:#ffd23f;--btn:#27c4ff;--btn2:#8b5cf6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%}
video,canvas{position:absolute;inset:0;width:100%;height:100%}
video{object-fit:fill;transform:scaleX(-1);opacity:.55;background:#10162e}
#hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-around;font-size:clamp(22px,4vw,44px);font-weight:800;text-shadow:0 2px 8px #000;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(11,16,32,.88);padding:20px}
h1{margin:0;font-size:clamp(30px,6vw,64px);color:var(--accent)}
.rules{font-size:clamp(18px,2.6vw,30px);line-height:1.5;max-width:760px}
button{font:inherit;font-weight:800;font-size:clamp(20px,3vw,32px);color:#06101f;background:var(--btn);border:0;border-radius:18px;padding:14px 30px;cursor:pointer}
button.alt{background:var(--btn2);color:#fff;font-size:clamp(16px,2vw,22px)}
#msg{font-size:18px;opacity:.85;min-height:24px}
</style>
</head>
<body>
<div id="stage">
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">⭐ 0</span><span id="tm">⏱ 45</span></div>
<div id="menu">
<h1>🤖 Caza Robots 🤖</h1>
<div class="rules">¡La cámara ve tus <b>manos</b>!<br>
Muévelas rápido sobre los <b>🤖 robots</b> y las <b>⭐ estrellas</b> para atraparlos.<br>
¡Cuidado con los <b>🐛 virus</b>: restan puntos!<br>
Tienes 45 segundos. Este juego fue hecho con IA.</div>
<button id="go">📷 Jugar con mis manos</button>
<button id="nocam" class="alt">🖱️ Jugar con mouse o dedo</button>
<div id="msg"></div>
</div>
</div>
<script>
(function(){
var v=document.getElementById('v'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
var menu=document.getElementById('menu'),sc=document.getElementById('sc'),tm=document.getElementById('tm'),msg=document.getElementById('msg');
var MW=80,MH=60,mc=document.createElement('canvas');mc.width=MW;mc.height=MH;
var mx=mc.getContext('2d',{willReadFrequently:true});
var prev=null,motion=new Uint8Array(MW*MH),useCam=false,playing=false;
var targets=[],pops=[],score=0,timeLeft=45,last=0,spawnT=0,ptr=null;
var W=0,H=0,dpr=1;
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);resize();

function readMotion(){
  if(!useCam||v.readyState<2)return;
  mx.drawImage(v,0,0,MW,MH);
  var d=mx.getImageData(0,0,MW,MH).data,n=MW*MH,cur=new Uint8Array(n);
  for(var i=0;i<n;i++){cur[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3}
  if(prev){for(var j=0;j<n;j++){motion[j]=Math.abs(cur[j]-prev[j])>22?1:0}}
  prev=cur;
}
function hitCam(t){
  var cx=(1-t.x/W)*MW,cy=t.y/H*MH,r=t.r/W*MW*1.0,c=0,tot=0;
  for(var y=Math.max(0,Math.floor(cy-r));y<=Math.min(MH-1,Math.ceil(cy+r));y++){
    for(var x=Math.max(0,Math.floor(cx-r));x<=Math.min(MW-1,Math.ceil(cx+r));x++){
      if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r){tot++;c+=motion[y*MW+x]}
    }
  }
  return tot>0&&c/tot>0.22;
}
function hitPtr(t){return ptr&&Math.hypot(ptr.x-t.x,ptr.y-t.y)<t.r+10}
cv.addEventListener('pointermove',function(e){var b=cv.getBoundingClientRect();ptr={x:e.clientX-b.left,y:e.clientY-b.top}});
cv.addEventListener('pointerdown',function(e){var b=cv.getBoundingClientRect();ptr={x:e.clientX-b.left,y:e.clientY-b.top}});
cv.addEventListener('pointerup',function(){if(e_isTouch)ptr=null});
var e_isTouch=true;

function spawn(){
  var k=Math.random(),type=k<0.55?'🤖':k<0.75?'⭐':'🐛';
  var r=Math.max(34,Math.min(W,H)*0.065);
  targets.push({x:r+Math.random()*(W-2*r),y:-r,r:r,type:type,vy:(type==='⭐'?190:110)+(45-timeLeft)*2.5+Math.random()*40});
}
function pop(t){
  var pts=t.type==='🤖'?10:t.type==='⭐'?5:-10;
  score=Math.max(0,score+pts);sc.textContent='⭐ '+score;
  pops.push({x:t.x,y:t.y,txt:(pts>0?'+':'')+pts,life:0.8,good:pts>0});
}
function tick(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  ctx.clearRect(0,0,W,H);
  if(playing){
    readMotion();
    timeLeft-=dt;tm.textContent='⏱ '+Math.max(0,Math.ceil(timeLeft));
    spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(0.35,0.9-(45-timeLeft)*0.012)}
    if(timeLeft<=0)end();
  }
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var i=targets.length-1;i>=0;i--){
    var t=targets[i];
    if(playing){
      t.y+=t.vy*dt;
      if((useCam&&hitCam(t))||(!useCam&&hitPtr(t))){pop(t);targets.splice(i,1);continue}
      if(t.y>H+t.r){targets.splice(i,1);continue}
    }
    ctx.font=(t.r*1.8)+'px serif';ctx.fillText(t.type,t.x,t.y);
  }
  for(var p=pops.length-1;p>=0;p--){
    var q=pops[p];q.life-=dt;q.y-=60*dt;
    if(q.life<=0){pops.splice(p,1);continue}
    ctx.globalAlpha=Math.min(1,q.life*2);ctx.font='800 40px sans-serif';
    ctx.fillStyle=q.good?'#7CFF8A':'#FF6B6B';ctx.fillText(q.txt,q.x,q.y);ctx.globalAlpha=1;
  }
  requestAnimationFrame(tick);
}
function begin(){
  score=0;timeLeft=45;targets=[];pops=[];spawnT=0;sc.textContent='⭐ 0';
  menu.style.display='none';playing=true;
}
function end(){
  playing=false;targets=[];
  menu.style.display='flex';
  menu.querySelector('h1').textContent='🎉 ¡Tiempo! '+score+' puntos';
  menu.querySelector('.rules').innerHTML='¿Puedes superar tu récord?<br>¡Que juegue el siguiente!';
  document.getElementById('go').textContent='📷 Jugar otra vez';
  msg.textContent='';
}
document.getElementById('go').onclick=function(){
  if(useCam){begin();return}
  msg.textContent='Pidiendo permiso para la cámara…';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent='Este navegador no permite cámara. Usa mouse o dedo.';return}
  navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}}).then(function(s){
    v.srcObject=s;useCam=true;v.play();begin();
  }).catch(function(){msg.textContent='No se pudo usar la cámara. Prueba abrir el juego en una pestaña propia o usa mouse/dedo.'});
};
document.getElementById('nocam').onclick=function(){useCam=false;v.style.display='none';begin()};
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
